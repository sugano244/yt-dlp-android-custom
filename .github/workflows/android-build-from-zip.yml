name: Build patched YTDLnis 1.9.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build-from-zip.yml'
      - '.github/patch_ytdlnis.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout original YTDLnis 1.9.0
        run: |
          rm -rf ytdlnis
          git clone --depth 1 --branch v1.9.0 https://github.com/deniscerri/ytdlnis.git ytdlnis

      - name: Apply YTDLnis patches
        working-directory: ytdlnis
        run: |
          python3 ../.github/patch_ytdlnis.py
          git diff --check
          git diff -- app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          git diff -- app/src/main/java/com/deniscerri/ytdl/ui/downloads/ActiveDownloadsFragment.kt
          git diff -- app/src/main/java/com/deniscerri/ytdl/ui/downloadcard/CutVideoBottomSheetDialog.kt
          git diff -- app/src/main/res/layout/cut_video_sheet.xml
          git diff -- app/build.gradle
          git diff -- app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: Prepare Android local properties and stable signing
        working-directory: ytdlnis
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          base64 -d ../.github/ytdlnis-patched-update.jks.b64 > app/ytdlnis-patched-update.jks
          PASS="$(python3 -c 'print("".join(chr(x) for x in [89,84,68,76,110,105,115,80,97,116,99,104,50,48,50,54]))')"
          cat > keystore.properties <<EOF
          signingConfig.storeFile=ytdlnis-patched-update.jks
          signingConfig.storePassword=$PASS
          signingConfig.keyAlias=ytdlnispatched
          signingConfig.keyPassword=$PASS
          EOF

      - name: Build original YTDLnis UI and features
        working-directory: ytdlnis
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --stacktrace

      - name: Locate APK
        run: |
          find ytdlnis/app/build/outputs/apk -type f -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: YTDLnis-1.9.0-patched-arm64-v8a
          path: ytdlnis/app/build/outputs/apk/github/debug/*arm64-v8a*.apk
          if-no-files-found: error
