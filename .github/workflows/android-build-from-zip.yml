name: Build patched YTDLnis 1.9.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout original YTDLnis 1.9.0
        run: |
          rm -rf ytdlnis
          git clone --depth 1 --branch v1.9.0 https://github.com/deniscerri/ytdlnis.git ytdlnis

      - name: Apply minimal YouTube section-audio fix
        working-directory: ytdlnis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt")
          s = p.read_text()
          old = '''                if (audioQualityId.isNotBlank()) {
                    if (audioQualityId.matches(".*-[0-9]+.*".toRegex())) {'''
          new = '''                // Avoid YouTube HLS audio 233/234 only when section cutting.
                if (downloadItem.downloadSections.isNotBlank() &&
                    downloadItem.url.isYoutubeURL() &&
                    (audioQualityId == "233/ba/b" || audioQualityId == "234/ba/b")) {
                    audioQualityId = "140/ba[ext=m4a]/ba/b"
                }

                if (audioQualityId.isNotBlank()) {
                    if (audioQualityId.matches(".*-[0-9]+.*".toRegex())) {'''
          if old not in s:
              # Match independent of indentation normalization in YAML heredoc.
              needle = '                if (audioQualityId.isNotBlank()) {\n                    if (audioQualityId.matches(".*-[0-9]+.*".toRegex())) {'
              old = needle
          if old not in s:
              raise SystemExit("Patch target not found; refusing to modify unrelated code")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt

      - name: Show numeric download percentage
        working-directory: ytdlnis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/deniscerri/ytdl/ui/downloads/ActiveDownloadsFragment.kt")
          s = p.read_text()
          old = 'outputText?.text = event.output'
          new = 'outputText?.text = "${event.progress.coerceIn(0, 100)}%  ${event.output}"'
          if old not in s:
              raise SystemExit("Progress text target not found")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/main/java/com/deniscerri/ytdl/ui/downloads/ActiveDownloadsFragment.kt

      - name: Make patched build independently updateable
        working-directory: ytdlnis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          old = 'applicationId "com.deniscerri.ytdl"'
          new = 'applicationId "com.deniscerri.ytdl.patched"'
          if old not in s:
              raise SystemExit("applicationId target not found")
          s = s.replace(old, new, 1)
          old_build = 'def versionBuild = 0'
          if old_build not in s:
              raise SystemExit("versionBuild target not found")
          import os
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          s = s.replace(old_build, f'def versionBuild = {run_number}', 1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: Prepare Android local properties and stable signing
        working-directory: ytdlnis
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          base64 -d ../.github/ytdlnis-patched-update.jks.b64 > app/ytdlnis-patched-update.jks
          cat > keystore.properties <<'EOF'
          signingConfig.storeFile=ytdlnis-patched-update.jks
          signingConfig.storePassword=YTDLnisPatch2026
          signingConfig.keyAlias=ytdlnispatched
          signingConfig.keyPassword=YTDLnisPatch2026
          EOF

      - name: Build original YTDLnis UI and features
        working-directory: ytdlnis
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --stacktrace

      - name: Locate APK
        run: |
          find ytdlnis/app/build/outputs/apk -type f -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: YTDLnis-1.9.0-patched-arm64-v8a
          path: ytdlnis/app/build/outputs/apk/github/debug/*arm64-v8a*.apk
          if-no-files-found: error
