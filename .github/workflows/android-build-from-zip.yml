name: Build patched YTDLnis 1.9.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout original YTDLnis 1.9.0
        run: |
          rm -rf ytdlnis
          git clone --depth 1 --branch v1.9.0 https://github.com/deniscerri/ytdlnis.git ytdlnis

      - name: Apply minimal YouTube section-audio fix
        working-directory: ytdlnis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt")
          s = p.read_text()
          old = '''                if (audioQualityId.isNotBlank()) {
                    if (audioQualityId.matches(".*-[0-9]+.*".toRegex())) {'''
          new = '''                // Avoid YouTube HLS audio 233/234 only when section cutting.
                if (downloadItem.downloadSections.isNotBlank() &&
                    downloadItem.url.isYoutubeURL() &&
                    (audioQualityId == "233/ba/b" || audioQualityId == "234/ba/b")) {
                    audioQualityId = "140/ba[ext=m4a]/ba/b"
                }

                if (audioQualityId.isNotBlank()) {
                    if (audioQualityId.matches(".*-[0-9]+.*".toRegex())) {'''
          if old not in s:
              # Match independent of indentation normalization in YAML heredoc.
              needle = '                if (audioQualityId.isNotBlank()) {\n                    if (audioQualityId.matches(".*-[0-9]+.*".toRegex())) {'
              old = needle
          if old not in s:
              raise SystemExit("Patch target not found; refusing to modify unrelated code")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: Prepare Android local properties
        working-directory: ytdlnis
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          : > keystore.properties

      - name: Build original YTDLnis UI and features
        working-directory: ytdlnis
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --stacktrace

      - name: Locate APK
        run: |
          find ytdlnis/app/build/outputs/apk -type f -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        with:
          name: YTDLnis-1.9.0-patched-original
          path: ytdlnis/app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
