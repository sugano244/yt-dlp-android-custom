name: NX809J SDR Lab APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate synthetic OFDM DSP
        run: |
          mkdir -p /tmp/ofdmclasses
          javac -encoding UTF-8 -d /tmp/ofdmclasses app/src/main/java/jp/nx809j/sdrlab/VirtualOfdm.java tests/OfdmTest.java
          java -cp /tmp/ofdmclasses jp.nx809j.sdrlab.OfdmTest
      - name: Validate Mode-3 IQ field analyzer
        run: |
          mkdir -p /tmp/iqclasses
          javac -encoding UTF-8 -d /tmp/iqclasses app/src/main/java/jp/nx809j/sdrlab/IqFieldAnalyzer.java tests/IqFieldTest.java
          java -cp /tmp/iqclasses jp.nx809j.sdrlab.IqFieldTest
      - name: Validate virtual full-seg frontend registers
        run: |
          mkdir -p /tmp/boardclasses
          javac -encoding UTF-8 -d /tmp/boardclasses app/src/main/java/jp/nx809j/sdrlab/IqFieldAnalyzer.java app/src/main/java/jp/nx809j/sdrlab/VirtualFullsegBoard.java tests/BoardEmulatorTest.java
          java -cp /tmp/boardclasses jp.nx809j.sdrlab.BoardEmulatorTest
      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NX809J-SDR-Lab-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
