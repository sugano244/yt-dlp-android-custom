name: NX809J SDR Lab APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate synthetic OFDM DSP
        run: |
          mkdir -p /tmp/ofdmclasses
          javac -encoding UTF-8 -d /tmp/ofdmclasses app/src/main/java/jp/nx809j/sdrlab/VirtualOfdm.java tests/OfdmTest.java
          java -cp /tmp/ofdmclasses jp.nx809j.sdrlab.OfdmTest
      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NX809J-SDR-Lab-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
